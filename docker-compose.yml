services:
  gliner:
    build: ./services/gliner
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      GLINER_MODEL: fastino/GLiNER2.5-Decide
      HF_HOME: /cache/huggingface
    volumes:
      - gliner-hf-cache:/cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 240s

  router:
    build: .
    ports:
      - "8080:8080"
    environment:
      ROUTER_CLASSIFIER: gliner
      ROUTER_GLINER_BASE_URL: http://gliner:8090
      # Written on the Docker host by `make detect-host` / `make docker-up`
      ROUTER_HOST_HARDWARE_FILE: /host/host_hardware.json
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}

    volumes:
      - router-data:/data
      - ./configs/config.docker.yaml:/configs/config.yaml:ro
      - ./data/host_hardware.json:/host/host_hardware.json:ro
    command: ["-config", "/configs/config.yaml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      gliner:
        condition: service_healthy

volumes:
  gliner-hf-cache:
  router-data:
