listen: "0.0.0.0:8080"
virtual_model: auto
data_dir: "/data"
# Required when listen is not loopback. Local compose default:
admin_token: local
api_token: local

providers:
  - id: ollama
    type: ollama
    # Docker Desktop: reach Ollama on the host
    base_url: "http://host.docker.internal:11434"
  - id: opencode-go
    type: openai_compatible
    base_url: "https://opencode.ai/zen/go/v1"
    api_key_env: OPENCODE_API_KEY
    quota: opencode_go

